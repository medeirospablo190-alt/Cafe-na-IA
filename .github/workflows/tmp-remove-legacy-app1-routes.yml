name: Temporary App1 legacy route cleanup

on:
  push:
    branches:
      - control-api-remove-legacy-app1-routes
    paths:
      - ".github/workflows/tmp-remove-legacy-app1-routes.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: control-api-remove-legacy-app1-routes
      - name: Finalize App1 route cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("grupo-lua-keymaster/services/control-api/src/server.js")
          text = path.read_text()

          legacy_const = "const APP1_SESSION_MS = 12 * 60 * 60 * 1000;\n"
          text = text.replace(legacy_const, "", 1)

          old_intro = (
              "// As rotas V1 são registradas antes das rotas legadas abaixo. Isso mantém\n"
              "// compatibilidade durante a migração sem permitir que a implementação antiga\n"
              "// intercepte login/sessão antes das novas regras de segurança.\n"
          )
          new_intro = (
              "// App 1 usa exclusivamente o contrato V1 com device binding, onboarding\n"
              "// server-side e sessão de 24 horas. Não registre uma rota paralela aqui.\n"
          )
          text = text.replace(old_intro, new_intro, 1)

          start_marker = "// Rotas legadas temporárias; permanecem durante a transição e serão removidas"
          end_marker = "registerMenuRoutes(app, { consumeCriticalAuthorization });"
          start = text.find(start_marker)
          if start >= 0:
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit("legacy block start found without end marker")
              text = text[:start] + end_marker + text[end + len(end_marker):]

          forbidden = [
              'app.post("/v1/app1/login"',
              'app.get("/v1/app1/me"',
              "APP1_SESSION_MS"
          ]
          for item in forbidden:
              if item in text:
                  raise SystemExit(f"legacy App1 auth code still present: {item}")
          if "registerApp1Routes(app" not in text:
              raise SystemExit("secure App1 V1 route registration missing")

          path.write_text(text)
          PY
          node --check grupo-lua-keymaster/services/control-api/src/server.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grupo-lua-keymaster/services/control-api/src/server.js
          git commit -m "security(control-api): finalize App1 auth route cleanup"
          git push origin HEAD:control-api-remove-legacy-app1-routes
