name: CAFEINA World Core CI

on:
  push:
    paths:
      - "world-core/**"
      - ".github/workflows/world-core-ci.yml"
  pull_request:
    paths:
      - "world-core/**"
      - ".github/workflows/world-core-ci.yml"

permissions:
  contents: read

jobs:
  linux-world-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        working-directory: world-core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: world-core
        run: cmake --build build --target cafeina_world_core_smoke --parallel 2

      - name: Smoke tests
        working-directory: world-core
        run: ctest --test-dir build --output-on-failure
