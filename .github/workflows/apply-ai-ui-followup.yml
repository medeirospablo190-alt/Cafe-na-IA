name: Apply AI UI Follow-up

on:
  push:
    paths:
      - ".github/workflows/apply-ai-ui-followup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply verified follow-up patch
        run: python3 tools/apply_ai_ui_followup.py

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/apply-ai-ui-followup.yml
          rm tools/apply_ai_ui_followup.py
          git config user.name "cafeina-continuity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No follow-up changes produced"; exit 1; }
          git commit -m "Stabilize AI chat reentry and drawer guidance"
          git push
