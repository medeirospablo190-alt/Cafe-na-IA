name: App1 Library Integration Once

on:
  push:
    branches:
      - app1-files-library
    paths:
      - ".github/workflows/app1-library-integrate-once.yml"

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: app1-files-library
      - name: Register library routes safely
        run: |
          python3 - <<'PY'
          from pathlib import Path

          server = Path('grupo-lua-keymaster/services/control-api/src/server.js')
          text = server.read_text()

          old_import = 'import { registerApp1Routes } from "./app1-routes.js";\n'
          new_import = old_import + 'import { registerApp1LibraryRoutes } from "./app1-library-routes.js";\n'
          if 'registerApp1LibraryRoutes' not in text:
              if old_import not in text:
                  raise SystemExit('App1 import anchor not found')
              text = text.replace(old_import, new_import, 1)

          text = text.replace('app.use(express.json({ limit: "64kb" }));', 'app.use(express.json({ limit: "2mb" }));', 1)

          anchor = '''registerApp1Routes(app, {
            requireKeymaster,
            consumeCriticalAuthorization,
            getApp1Maintenance
          });

          // O contrato App 1 V1 acima é a única implementação de login/sessão.
          '''
          replacement = '''registerApp1Routes(app, {
            requireKeymaster,
            consumeCriticalAuthorization,
            getApp1Maintenance
          });

          // Biblioteca persistente do App 1. Usa apenas sessões FULL vinculadas
          // ao dispositivo e mantém os itens ligados ao ID permanente da conta.
          registerApp1LibraryRoutes(app);

          // O contrato App 1 V1 acima é a única implementação de login/sessão.
          '''
          if 'registerApp1LibraryRoutes(app);' not in text:
              if anchor not in text:
                  raise SystemExit('App1 registration anchor not found')
              text = text.replace(anchor, replacement, 1)

          server.write_text(text)

          ci = Path('.github/workflows/keymaster-ci.yml')
          ci_text = ci.read_text()
          if 'node --check src/app1-library-routes.js' not in ci_text:
              ci_text = ci_text.replace(
                  'node --check src/app1-routes.js\n',
                  'node --check src/app1-routes.js\n          node --check src/app1-library-routes.js\n',
                  1
              )
          ci.write_text(ci_text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grupo-lua-keymaster/services/control-api/src/server.js .github/workflows/keymaster-ci.yml
          if git diff --cached --quiet; then
            echo "Integration already applied."
            exit 0
          fi
          git commit -m "Register App 1 persistent library routes"
          git push origin HEAD:app1-files-library
