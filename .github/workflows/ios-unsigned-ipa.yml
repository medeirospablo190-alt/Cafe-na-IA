name: iOS Unsigned IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "grupo-lua-keymaster/apps/app1/**"
      - "grupo-lua-keymaster/apps/keymaster/**"
      - "grupo-lua-keymaster/packages/contracts/**"
      - "grupo-lua-keymaster/package.json"
      - "grupo-lua-keymaster/scripts/check-mobile-assets.mjs"
      - "grupo-lua-keymaster/scripts/npm-install-retry.sh"
      - ".github/workflows/ios-unsigned-ipa.yml"

permissions:
  contents: read

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "app1"
            product: "APP1"
            workspace: "@grupo-lua/app1"
            app_dir: "grupo-lua-keymaster/apps/app1"
          - id: "keymaster"
            product: "KEYMASTER"
            workspace: "@grupo-lua/keymaster"
            app_dir: "grupo-lua-keymaster/apps/keymaster"

    env:
      CI: "1"
      EXPO_PUBLIC_GRUPO_LUA_API_URL: https://grupo-lua-control-api.onrender.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grupo-lua-keymaster/package-lock.json

      - name: Resolve app version
        id: app-version
        working-directory: ${{ matrix.app_dir }}
        run: |
          VERSION="$(node -p "require('./app.json').expo.version")"
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building GRUPO LUA ${{ matrix.product }} v$VERSION"

      - name: Validate mobile assets
        working-directory: grupo-lua-keymaster
        run: npm run assets:check -- "${{ matrix.id }}"

      - name: Install workspace dependencies
        working-directory: grupo-lua-keymaster
        run: bash scripts/npm-install-retry.sh

      - name: TypeScript check
        working-directory: grupo-lua-keymaster
        run: npm --workspace "${{ matrix.workspace }}" run typecheck

      - name: Validate Control API target
        working-directory: ${{ matrix.app_dir }}
        run: npm run build:check-api

      - name: Generate iOS project
        working-directory: ${{ matrix.app_dir }}
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ${{ matrix.app_dir }}
        run: npx pod-install ios

      - name: Build unsigned iPhone app
        working-directory: ${{ matrix.app_dir }}
        shell: bash
        run: |
          set -uo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          PROJECT="$(find ios -maxdepth 1 -name '*.xcodeproj' -print -quit)"
          test -n "$WORKSPACE"
          test -n "$PROJECT"

          # Read the shared scheme from the application project, not from the
          # workspace. The workspace also exposes CocoaPods schemes and the
          # first one alphabetically may be a dependency rather than the app.
          SCHEME="$(xcodebuild -list -json -project "$PROJECT" | python3 -c 'import json,sys; d=json.load(sys.stdin); o=d.get("project") or {}; s=o.get("schemes") or []; print(s[0] if s else "")')"
          test -n "$SCHEME"

          echo "Workspace: $WORKSPACE"
          echo "Project: $PROJECT"
          echo "Application scheme: $SCHEME"

          LOG="$GITHUB_WORKSPACE/xcode-${{ matrix.id }}.log"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/ios-build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            clean build 2>&1 | tee "$LOG"
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ]; then
            {
              echo "=== Xcode errors ==="
              grep -E "error:|fatal error|BUILD FAILED|Command .* failed|Signing for|requires a development team|Provisioning profile" "$LOG" | tail -300 || true
            } > "$GITHUB_WORKSPACE/xcode-${{ matrix.id }}-errors.txt"
            cat "$GITHUB_WORKSPACE/xcode-${{ matrix.id }}-errors.txt"
            exit "$STATUS"
          fi

          APP_PATH="$(find "$PWD/ios-build/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Application bundle was not found. Available build products:"
            find "$PWD/ios-build/Build/Products" -maxdepth 3 -type d -name '*.app' -print || true
            exit 1
          fi

          echo "Application bundle: $APP_PATH"
          ARTIFACT="GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-ios-unsigned"
          IPA="GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-unsigned.ipa"
          OUT="$GITHUB_WORKSPACE/dist/$ARTIFACT"
          mkdir -p "$OUT/Payload"
          cp -R "$APP_PATH" "$OUT/Payload/"
          (
            cd "$OUT"
            zip -qry "$IPA" Payload
            shasum -a 256 "$IPA" > "$IPA.sha256"
            rm -rf Payload
          )

      - name: Upload Xcode diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-diagnostics-${{ matrix.id }}
          path: |
            xcode-${{ matrix.id }}.log
            xcode-${{ matrix.id }}-errors.txt
          if-no-files-found: warn
          retention-days: 2

      - name: Upload unsigned IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-ios-unsigned
          path: |
            dist/GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-ios-unsigned/GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-unsigned.ipa
            dist/GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-ios-unsigned/GRUPO-LUA-${{ matrix.product }}-v${{ steps.app-version.outputs.version }}-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
