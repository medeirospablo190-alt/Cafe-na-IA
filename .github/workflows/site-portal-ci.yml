name: Site Portal CI

on:
  push:
    paths:
      - "server.js"
      - "package.json"
      - "public/**"
      - "scripts/hash-download-password.mjs"
      - "test/site-portal.test.mjs"
      - ".github/workflows/site-portal-ci.yml"
      - ".env.example"
      - ".gitignore"
      - "README.md"
  pull_request:
    paths:
      - "server.js"
      - "package.json"
      - "public/**"
      - "scripts/hash-download-password.mjs"
      - "test/site-portal.test.mjs"
      - ".github/workflows/site-portal-ci.yml"
      - ".env.example"
      - ".gitignore"
      - "README.md"

jobs:
  portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Security flow tests
        run: npm test
