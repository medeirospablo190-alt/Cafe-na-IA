name: CAFEINA Android App CI

on:
  push:
    paths:
      - "executor-app/**"
      - "executor-runtime/**"
      - ".github/workflows/executor-app-ci.yml"
  pull_request:
    paths:
      - "executor-app/**"
      - "executor-runtime/**"
      - ".github/workflows/executor-app-ci.yml"

# New pushes supersede tests for older commits on the same branch/PR.
# Avoid consuming Android emulator minutes for already superseded snapshots.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unit tests
        working-directory: executor-app
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: executor-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify native runtime packaged
        working-directory: executor-app
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libcafeina_luau_jni.so"
          unzip -l "$APK" | grep -F "lib/x86_64/libcafeina_luau_jni.so"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          unzip -l "$APK" | grep -F "assets/project.godot"
          unzip -l "$APK" | grep -F "assets/world.gd"
          unzip -p "$APK" assets/project.godot | grep -qx "window/handheld/orientation=0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute native runtime on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            gradle -p executor-app :app:connectedDebugAndroidTest --stacktrace
            adb logcat -d -v brief > godot-world-android-logcat.txt
            ! grep -Ei 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load main scene' godot-world-android-logcat.txt

      - name: Package installable ARM64 APK
        working-directory: executor-app
        run: gradle -PcafeinaArm64Only=true :app:assembleDebug --stacktrace

      - name: Verify ARM64 APK contains no emulator libraries
        working-directory: executor-app
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_luau_jni.so"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          unzip -p "$APK" assets/project.godot | grep -qx "window/handheld/orientation=0"
          if unzip -Z1 "$APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 library in installable APK"
            exit 1
          fi

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: cafeina-android-arm64-apk
          path: executor-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build side-by-side ARM64 world preview APK
        working-directory: executor-app
        run: gradle -PcafeinaArm64Only=true :app:assemblePreview --stacktrace

      - name: Verify isolated preview package and world orientation
        working-directory: executor-app
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/preview -name '*.apk' -print -quit)"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.cafeina.executor.preview'"
          unzip -p "$APK" assets/project.godot | grep -qx "window/handheld/orientation=0"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_luau_jni.so"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          if unzip -Z1 "$APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 library in preview APK"
            exit 1
          fi

      - name: Upload independent ARM64 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: cafeina-world-landscape-preview-arm64-apk
          path: executor-app/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
