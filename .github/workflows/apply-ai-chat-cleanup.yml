name: Apply AI Chat Cleanup

on:
  push:
    paths:
      - ".github/workflows/apply-ai-chat-cleanup.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply verified UI patch
        run: python3 tools/apply_ai_ui_patch.py

      - name: Commit UI migration and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/apply-ai-chat-cleanup.yml
          rm tools/apply_ai_ui_patch.py
          git config user.name "cafeina-continuity-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --quiet && { echo "No migration changes produced"; exit 1; }
          git commit -m "Move AI controls into side drawer"
          git push
