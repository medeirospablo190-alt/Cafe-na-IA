name: CAFEINA Local LLM Compile Probe

on:
  push:
    paths:
      - "executor-app/**"
      - "executor-runtime/**"
      - ".github/workflows/executor-local-llm-probe.yml"
  pull_request:
    paths:
      - "executor-app/**"
      - "executor-runtime/**"
      - ".github/workflows/executor-local-llm-probe.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-arm64-llama-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build side-by-side ARM64 preview APK with local LLM enabled
        working-directory: executor-app
        run: |
          gradle \
            -PcafeinaArm64Only=true \
            -PcafeinaLocalLlm=true \
            :app:assemblePreview \
            --stacktrace

      - name: Verify llama.cpp probe is packaged
        working-directory: executor-app
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/preview -name '*.apk' -print -quit)"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_llm_probe.so"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_llama_jni.so"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_luau_jni.so"

          TMP="$(mktemp -d)"
          unzip -q "$APK" "lib/arm64-v8a/libcafeina_llama_jni.so" -d "$TMP"
          READELF="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          if [ ! -x "$READELF" ]; then
            READELF="$ANDROID_HOME/ndk/29.0.14206865/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          fi
          test -x "$READELF"
          "$READELF" -Ws "$TMP/lib/arm64-v8a/libcafeina_llama_jni.so" \
            | grep -F "Java_com_cafeina_runtime_LlamaBridge_nativeOpen"
          "$READELF" -Ws "$TMP/lib/arm64-v8a/libcafeina_llama_jni.so" \
            | grep -F "Java_com_cafeina_runtime_LlamaBridge_nativeGenerateBytes"
          "$READELF" -Ws "$TMP/lib/arm64-v8a/libcafeina_llama_jni.so" \
            | grep -F "Java_com_cafeina_runtime_LlamaBridge_nativeCancelGeneration"
          "$READELF" -Ws "$TMP/lib/arm64-v8a/libcafeina_llama_jni.so" \
            | grep -F "Java_com_cafeina_runtime_LlamaBridge_nativeClose"

          if unzip -Z1 "$APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 library in local LLM probe APK"
            exit 1
          fi

      - name: Upload installable ARM64 local-LLM test APK
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: cafeina-local-llm-preview-arm64-${{ github.run_number }}
          path: executor-app/app/build/outputs/apk/preview/*.apk
          if-no-files-found: error
          retention-days: 7
