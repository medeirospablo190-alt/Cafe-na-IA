name: CAFEINA Local LLM Compile Probe

on:
  push:
    paths:
      - "executor-app/**"
      - "executor-runtime/**"
      - ".github/workflows/executor-local-llm-probe.yml"
  pull_request:
    paths:
      - "executor-app/**"
      - "executor-runtime/**"
      - ".github/workflows/executor-local-llm-probe.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-arm64-llama-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android native toolchain
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build ARM64 APK with local LLM probe enabled
        working-directory: executor-app
        run: |
          gradle             -PcafeinaArm64Only=true             -PcafeinaLocalLlm=true             :app:assembleDebug             --stacktrace

      - name: Verify llama.cpp probe is packaged
        working-directory: executor-app
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_llm_probe.so"
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/libcafeina_luau_jni.so"
          if unzip -Z1 "$APK" | grep -E '^lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "Unexpected non-ARM64 library in local LLM probe APK"
            exit 1
          fi
