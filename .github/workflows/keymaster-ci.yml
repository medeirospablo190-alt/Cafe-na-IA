name: Keymaster CI

on:
  push:
    paths:
      - "grupo-lua-keymaster/**"
      - "render-control-api.yaml"
      - ".github/workflows/keymaster-ci.yml"
  pull_request:
    paths:
      - "grupo-lua-keymaster/**"
      - "render-control-api.yaml"
      - ".github/workflows/keymaster-ci.yml"

jobs:
  control-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grupolua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grupolua_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grupolua_test
      DATABASE_SSL: "false"
      SESSION_PEPPER: ci-session-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
      DEVICE_FINGERPRINT_PEPPER: ci-device-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
    defaults:
      run:
        working-directory: grupo-lua-keymaster/services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: bash ../../scripts/npm-install-retry.sh
      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/app1-routes.js
          node --check src/menu-routes.js
          node --check src/security.js
          node --check src/integrity.js
          node --check src/db.js
          node --check scripts/migrate.mjs
          node --check scripts/production-readiness.mjs
      - name: App 1 route architecture guard
        run: |
          if grep -Fq 'app.post("/v1/app1/login"' src/server.js; then
            echo "::error::Legacy App1 login route must not exist in server.js"
            exit 1
          fi
          if grep -Fq 'app.get("/v1/app1/me"' src/server.js; then
            echo "::error::Legacy App1 session route must not exist in server.js"
            exit 1
          fi
          if grep -Fq 'APP1_SESSION_MS' src/server.js; then
            echo "::error::Legacy App1 session lifetime must not exist in server.js"
            exit 1
          fi
          grep -Fq 'registerApp1Routes(app' src/server.js
          grep -Fq 'app.post("/v1/app1/login"' src/app1-routes.js
          grep -Fq 'app.get("/v1/app1/me"' src/app1-routes.js
      - name: Production readiness guard
        env:
          KEYMASTER_ACCESS_HASH: 'scrypt$32768$8$1$Y2ktc2FsdA$Y2ktaGFzaA'
          PUBLIC_BASE_URL: https://grupo-lua-control-api.example.com
          APP_INTEGRITY_MODE: report
          CRITICAL_ACTIONS_ENABLED: "false"
        run: |
          npm run production:check
          if PUBLIC_BASE_URL=https://cafe-na-ia.onrender.com npm run production:check; then
            echo "::error::Production guard accepted the download portal as Control API"
            exit 1
          fi
          grep -q "plan: free" ../../../render-control-api.yaml
          if grep -q "preDeployCommand:" ../../../render-control-api.yaml; then
            echo "::error::Render Free Blueprint must not use preDeployCommand"
            exit 1
          fi
          if grep -q '^databases:' ../../../render-control-api.yaml; then
            echo "::error::Free deployment must use the external persistent Postgres URL, not expiring Render Free Postgres"
            exit 1
          fi
          grep -q 'startCommand: npm run start:free' ../../../render-control-api.yaml
          grep -q 'key: DATABASE_URL' ../../../render-control-api.yaml
          grep -q 'value: "true"' ../../../render-control-api.yaml
          if grep -q "cafe-na-ia.onrender.com" ../../../render-control-api.yaml; then
            echo "::error::Control API Blueprint must not point at the download portal"
            exit 1
          fi
      - name: Apply database migrations twice
        run: |
          npm run migrate
          npm run migrate
      - name: Security and menu unit tests
        run: node --test test/*.test.mjs

  shared-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grupo-lua-keymaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract tests
        run: node --test packages/contracts/test/*.test.mjs

  mobile-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grupo-lua-keymaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: bash scripts/npm-install-retry.sh
      - name: Mobile Control API build guard
        run: |
          EXPO_PUBLIC_GRUPO_LUA_API_URL=https://grupo-lua-control-api.example.com node scripts/check-mobile-api-url.mjs
          if EXPO_PUBLIC_GRUPO_LUA_API_URL=https://cafe-na-ia.onrender.com node scripts/check-mobile-api-url.mjs; then
            echo "::error::Mobile guard accepted the download portal"
            exit 1
          fi
          if EXPO_PUBLIC_GRUPO_LUA_API_URL=http://grupo-lua-control-api.example.com node scripts/check-mobile-api-url.mjs; then
            echo "::error::Mobile guard accepted a non-HTTPS API"
            exit 1
          fi
          if EXPO_PUBLIC_GRUPO_LUA_API_URL=https://control-api.invalid node scripts/check-mobile-api-url.mjs; then
            echo "::error::Mobile guard accepted a reserved domain"
            exit 1
          fi
          if env -u EXPO_PUBLIC_GRUPO_LUA_API_URL node scripts/check-mobile-api-url.mjs; then
            echo "::error::Mobile guard accepted a missing API URL"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          for (const app of ['app1', 'keymaster']) {
            const pkg = JSON.parse(fs.readFileSync(`apps/${app}/package.json`, 'utf8'));
            if (!pkg.scripts?.['eas-build-pre-install']) throw new Error(`${app}: missing EAS pre-install guard`);
            const eas = JSON.parse(fs.readFileSync(`apps/${app}/eas.json`, 'utf8'));
            for (const profile of ['production-apk', 'production-ios-internal', 'production-store']) {
              if (eas.build?.[profile]?.environment !== 'production') {
                throw new Error(`${app}: ${profile} is not bound to EAS production environment`);
              }
            }
            if (eas.build?.preview?.environment !== 'preview') {
              throw new Error(`${app}: preview is not bound to EAS preview environment`);
            }
          }
          NODE
      - name: Keymaster TypeScript check
        run: npm --workspace @grupo-lua/keymaster run typecheck
      - name: App 1 mobile TypeScript check
        run: npm --workspace @grupo-lua/app1 run typecheck
      - name: App 1 compatibility probe TypeScript check
        run: npm --workspace @grupo-lua/app1-probe run typecheck
