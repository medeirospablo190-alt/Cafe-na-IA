name: Keymaster CI

on:
  push:
    paths:
      - "grupo-lua-keymaster/**"
      - ".github/workflows/keymaster-ci.yml"
  pull_request:
    paths:
      - "grupo-lua-keymaster/**"
      - ".github/workflows/keymaster-ci.yml"

jobs:
  control-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: grupolua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d grupolua_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/grupolua_test
      DATABASE_SSL: "false"
      SESSION_PEPPER: ci-session-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
      DEVICE_FINGERPRINT_PEPPER: ci-device-pepper-0123456789-abcdefghijklmnopqrstuvwxyz
    defaults:
      run:
        working-directory: grupo-lua-keymaster/services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --ignore-scripts
      - name: Syntax check
        run: |
          node --check src/server.js
          node --check src/app1-routes.js
          node --check src/menu-routes.js
          node --check src/security.js
          node --check src/integrity.js
          node --check src/db.js
          node --check scripts/migrate.mjs
      - name: Apply database migrations
        run: npm run migrate
      - name: Security and menu unit tests
        run: node --test test/*.test.mjs

  shared-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grupo-lua-keymaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Contract tests
        run: node --test packages/contracts/test/*.test.mjs

  mobile-compatibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grupo-lua-keymaster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace dependencies
        run: npm install --ignore-scripts
      - name: Keymaster TypeScript check
        run: npm --workspace @grupo-lua/keymaster run typecheck
      - name: App 1 mobile TypeScript check
        run: npm --workspace @grupo-lua/app1 run typecheck
      - name: App 1 compatibility probe TypeScript check
        run: npm --workspace @grupo-lua/app1-probe run typecheck
