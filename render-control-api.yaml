# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: grupo-lua-control-api
    runtime: node
    region: virginia
    # Fase inicial: plano gratuito. O serviço pode dormir após inatividade.
    plan: free
    rootDir: grupo-lua-keymaster/services/control-api
    buildCommand: npm install --omit=dev
    # No plano Free não usamos preDeployCommand. O start:free executa
    # readiness + migrations versionadas antes de iniciar a API.
    startCommand: npm run start:free
    healthCheckPath: /v1/health
    # O aplicativo e a API precisam avançar juntos. Auto deploy evita que um
    # APK novo converse com um backend antigo (causa dos campos vazios/undefined
    # observados durante os testes mobile).
    autoDeploy: true
    maxShutdownDelaySeconds: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: grupo-lua-control-api
          envVarKey: RENDER_EXTERNAL_URL
      # Banco externo persistente (Neon Free). Cole apenas a connection string
      # privada no painel do Render; nunca coloque DATABASE_URL no GitHub.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: KEYMASTER_ACCESS_HASH
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
      - key: DEVICE_FINGERPRINT_PEPPER
        generateValue: true
      - key: APP_INTEGRITY_MODE
        value: report
      - key: CRITICAL_ACTIONS_ENABLED
        value: "false"
      - key: APP1_TERMS_VERSION
        value: "1.0"
      - key: APP1_PRIVACY_VERSION
        value: "1.0"
