# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: grupo-lua-control-api
    runtime: node
    region: virginia
    # Produção: mantém o serviço ativo e habilita preDeployCommand.
    plan: 0.5c-512mb
    rootDir: grupo-lua-keymaster/services/control-api
    buildCommand: npm install --omit=dev
    preDeployCommand: npm run production:check && npm run migrate
    startCommand: npm run start:production
    healthCheckPath: /v1/health
    autoDeploy: false
    maxShutdownDelaySeconds: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: grupo-lua-control-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: grupo-lua-control-db
          property: connectionString
      # O connectionString acima é a URL privada interna do Render.
      - key: DATABASE_SSL
        value: "false"
      - key: KEYMASTER_ACCESS_HASH
        sync: false
      - key: SESSION_PEPPER
        generateValue: true
      - key: DEVICE_FINGERPRINT_PEPPER
        generateValue: true
      - key: APP_INTEGRITY_MODE
        value: report
      - key: CRITICAL_ACTIONS_ENABLED
        value: "false"
      - key: APP1_TERMS_VERSION
        value: "1.0"
      - key: APP1_PRIVACY_VERSION
        value: "1.0"

databases:
  - name: grupo-lua-control-db
    region: virginia
    # Menor plano persistente pago; o plano free expira e não é adequado à produção.
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    connectionPool: none
    # Sem acesso público ao banco; a Control API usa a rede privada do Render.
    ipAllowList: []
